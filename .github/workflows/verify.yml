name: Verify frozen numerical evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpu-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-verify.txt
            requirements-analysis.txt
      - name: Install verification dependency
        run: python -m pip install -r requirements-verify.txt
      - name: Verify immutable evidence and numeric results
        run: python scripts/verify_reproduction.py
      - name: Run numerical unit tests
        run: python -m unittest discover -s tests -v
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Regenerate v6 numerical tables and figures
        run: python analysis/recompute_v3.py
      - name: Compare recomputed results to frozen reference
        run: python analysis/verify_reference.py
